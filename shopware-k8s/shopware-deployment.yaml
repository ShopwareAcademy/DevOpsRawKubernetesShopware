# shopware-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopware
  namespace: shopware
  labels:
    app: shopware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopware
  template:
    metadata:
      labels:
        app: shopware
    spec:
      containers:
        - name: shopware
          image: shopware-devops-lp:local
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: shopware-config
            - secretRef:
                name: shopware-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /api/_info/health-check
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/_info/health-check
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shopware
  namespace: shopware
spec:
  selector:
    app: shopware
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
